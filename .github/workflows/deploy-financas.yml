name: Deploy Meu Financeiro Pessoal

on:
  push:
    branches: [main]
    paths:
      - "public/financas/**"
      - "api/**"
      - "tests/**"
      - "vercel.json"
      - ".github/workflows/deploy-financas.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-financas-auth-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment_retry2.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_primary.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Validar arquivos do aplicativo
        run: |
          test -s public/financas/index.html
          test -s public/financas/styles.css
          test -s public/financas/app.js
          test -s public/financas/manifest.webmanifest
          test -s public/financas/service-worker.js
          test -s api/scan-receipt.js
          test -s tests/scan-receipt.test.js
          test -s public/financas/supabase.sql
          node --check public/financas/app.js
          node --check api/scan-receipt.js
          node --test tests/scan-receipt.test.js
          python3 -m json.tool public/financas/manifest.webmanifest > /dev/null
          grep -q 'id="budget-month-picker"' public/financas/index.html
          grep -q "meu-financeiro-device-v16" public/financas/service-worker.js
          echo "Sintaxe JavaScript, manifesto PWA e controles mensais validados."
          mkdir -p site
          cp -R public/financas/. site/
          touch site/.nojekyll
          test -s site/index.html
          echo "Arquivos do aplicativo validados."

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Aguardar o artefato ficar visível na API do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            echo "Verificação ${attempt}/12: procurando ${EXPECTED_ARTIFACT}"
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.EXPECTED_ARTIFACT) | .id' | head -n 1)"
            if [ -n "${artifact_id}" ]; then
              echo "Artefato localizado: ${artifact_id}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::O artefato não ficou disponível na API após 60 segundos."
          exit 1

      - name: Publicar no GitHub Pages (tentativa 1)
        id: deployment_primary
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aguardar antes da segunda tentativa
        if: steps.deployment_primary.outcome == 'failure'
        run: sleep 15

      - name: Publicar no GitHub Pages (tentativa 2)
        id: deployment_retry1
        if: steps.deployment_primary.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Aguardar antes da terceira tentativa
        if: steps.deployment_retry1.outcome == 'failure'
        run: sleep 20

      - name: Publicar no GitHub Pages (tentativa 3)
        id: deployment_retry2
        if: steps.deployment_retry1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Confirmar resultado do deploy
        if: always()
        env:
          ATTEMPT_1: ${{ steps.deployment_primary.outcome }}
          ATTEMPT_2: ${{ steps.deployment_retry1.outcome }}
          ATTEMPT_3: ${{ steps.deployment_retry2.outcome }}
        run: |
          if [[ "$ATTEMPT_1" == "success" || "$ATTEMPT_2" == "success" || "$ATTEMPT_3" == "success" ]]; then
            echo "GitHub Pages publicou com sucesso."
          else
            echo "::error::As três tentativas de publicação falharam."
            exit 1
          fi

      - name: Verificar página e arquivos publicados
        env:
          PAGE_URL: ${{ steps.deployment_retry2.outputs.page_url || steps.deployment_retry1.outputs.page_url || steps.deployment_primary.outputs.page_url }}
        run: |
          set -e
          base="${PAGE_URL%/}"
          for attempt in {1..12}; do
            code="$(curl -sSL -o /tmp/mfp-index.html -w '%{http_code}' "$PAGE_URL" || true)"
            if [ "$code" = "200" ] && grep -q "Meu Financeiro Pessoal" /tmp/mfp-index.html; then
              echo "Página principal respondeu HTTP 200."
              break
            fi
            if [ "$attempt" = "12" ]; then
              echo "::error::A página não respondeu corretamente após 60 segundos (HTTP $code)."
              exit 1
            fi
            echo "Aguardando propagação do GitHub Pages (tentativa $attempt/12; HTTP $code)."
            sleep 5
          done
          for asset in styles.css app.js manifest.webmanifest service-worker.js; do
            curl -fsS "$base/$asset" -o /dev/null
            echo "Arquivo publicado: $asset"
          done
