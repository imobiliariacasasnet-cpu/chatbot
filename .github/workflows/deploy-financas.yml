name: Deploy Meu Financeiro Pessoal

on:
  push:
    branches: [main]
    paths:
      - "public/financas/**"
      - ".github/workflows/deploy-financas.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-financas
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Validar arquivos do aplicativo
        run: |
          test -s public/financas/index.html
          test -s public/financas/styles.css
          test -s public/financas/app.js
          test -s public/financas/manifest.webmanifest
          test -s public/financas/service-worker.js
          mkdir -p site
          cp -R public/financas/. site/
          touch site/.nojekyll
          test -s site/index.html
          echo "Arquivos do aplicativo validados."

      - name: Enviar arquivos estáticos
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site

      - name: Aguardar o artefato ficar visível na API do GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            echo "Verificação ${attempt}/12: procurando ${EXPECTED_ARTIFACT}"
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" --jq '.artifacts[] | select(.name == env.EXPECTED_ARTIFACT) | .id' | head -n 1)"
            if [ -n "${artifact_id}" ]; then
              echo "Artefato localizado: ${artifact_id}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::O artefato não ficou disponível na API após 60 segundos."
          exit 1

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
