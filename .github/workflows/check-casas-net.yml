name: Check Casas Net site

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/check-casas-net.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/check-casas-net.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-casas-net-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit
